[build]
  command = "cd ng-tasky && npm ci && npm run build && cd ../xp-tasky && npm ci"
  publish = "ng-tasky/dist/ng-tasky/browser"
  functions = "xp-tasky/netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "bcryptjs", "nodemailer", "google-auth-library", "axios"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "/.netlify/functions/api/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
