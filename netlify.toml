[build]
  base = "ng-tasky"
  command = "npm ci && npm run build && cd ../xp-tasky && npm ci"
  publish = "dist/ng-tasky"
  functions = "../xp-tasky/netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "bcryptjs", "nodemailer", "google-auth-library", "axios"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "/.netlify/functions/api/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID,SMTP_HOST"