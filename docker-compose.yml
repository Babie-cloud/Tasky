services:
  mongodb:
    image: mongo:latest
    container_name: tasky-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./xp-tasky
    container_name: tasky-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./xp-tasky/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/tasky
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb

  frontend:
    build: ./ng-tasky
    container_name: tasky-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: