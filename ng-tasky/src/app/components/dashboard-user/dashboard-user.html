<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">Welcome back, {{ userName }}</h2>
      <p class="text-muted mb-0">Choisis un tableau ou crée-en un nouveau.</p>
    </div>
    <button type="button" class="btn btn-light rounded-circle" routerLink="/profile">
      <i class="fa-solid fa-user"></i>
    </button>
  </div>

  <div class="row g-3">
    @for (board of boards(); track board._id) {
      <div class="col-md-4">
        <div class="card h-100 shadow-sm board-card" (click)="openBoard(board._id)" style="cursor: pointer;">
          <div class="card-body">
            <h5 class="card-title mb-1 text-primary">{{ board.name }}</h5>
            <p class="text-muted small mb-0">
              {{ board.members?.length || 0 }} membre(s)
            </p>
          </div>
        </div>
      </div>
    }

    <!-- Carte pour créer un nouveau tableau -->
    <div class="col-md-4">
      <div class="card h-100 border-dashed">
        <div class="card-body">
          <h6 class="fw-bold mb-2"><i class="fa-solid fa-plus me-1"></i> Nouveau tableau</h6>
          <input
            type="text"
            class="form-control form-control-sm mb-2"
            placeholder="Ex: Études, Projet client..."
            [(ngModel)]="newBoardName"
            (keyup.enter)="createBoard()"
          />
          <button type="button" class="btn btn-sm btn-dark w-100" [disabled]="isCreating()" (click)="createBoard()">
            {{ isCreating() ? 'Création...' : 'Créer' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
