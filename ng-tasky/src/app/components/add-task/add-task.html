<div class="container py-4" style="max-width: 500px;">
  <h4 class="fw-bold mb-3">Ajouter une tâche</h4>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Titre de la tâche</label>
      <input type="text" class="form-control" formControlName="title" placeholder="Ex: Finir le rapport">
    </div>

    <div class="mb-3">
      <label class="form-label">Liste</label>
      <select class="form-select" formControlName="list">
        @for (list of lists(); track list._id) {
          <option [value]="list._id">{{ list.title }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Date limite (optionnel)</label>
      <input type="date" class="form-control" formControlName="dueDate">
    </div>

    <button type="submit" class="btn btn-dark w-100" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Ajout...' : 'Ajouter' }}
    </button>
  </form>
</div>
