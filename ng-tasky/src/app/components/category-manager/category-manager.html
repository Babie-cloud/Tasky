<div class="category-manager">
  @if (isLoading()) {
    <p class="text-muted small mb-0">Chargement...</p>
  } @else {

    @if (categories().length === 0) {
      <p class="text-muted small mb-2">Aucune catégorie pour l'instant.</p>
    }

    <div class="d-flex flex-wrap gap-2 mb-3">
      @for (category of categories(); track category._id) {
        @if (editingId() === category._id) {
          <div class="d-flex align-items-center gap-1 edit-row">
            <input type="color" class="form-control form-control-color" [(ngModel)]="editColor" />
            <input type="text" class="form-control form-control-sm" [(ngModel)]="editName" style="width: 120px;" />
            <button class="btn btn-sm btn-success" (click)="saveEdit(category._id)"><i class="fa-solid fa-check"></i></button>
            <button class="btn btn-sm btn-light" (click)="cancelEdit()"><i class="fa-solid fa-xmark"></i></button>
          </div>
        } @else {
          <span class="badge rounded-pill category-pill" [style.--chip-color]="category.color">
            {{ category.name }}
            @if (!readonly) {
              <i class="fa-solid fa-pen ms-2" role="button" (click)="startEdit(category)"></i>
              <i class="fa-solid fa-trash ms-1" role="button" (click)="deleteCategory(category._id)"></i>
            }
          </span>
        }
      }
    </div>

    @if (!readonly) {
      <div class="d-flex align-items-center gap-2">
        <input type="color" class="form-control form-control-color" [(ngModel)]="newColor" />
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Nom de la catégorie"
          [(ngModel)]="newName"
          (keyup.enter)="createCategory()"
          style="max-width: 200px;"
        />
        <button class="btn btn-sm btn-dark" [disabled]="isCreating()" (click)="createCategory()">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    }
  }
</div>
