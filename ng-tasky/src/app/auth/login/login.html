<div class="auth-wrapper">
  <div class="auth-bubble auth-bubble-1" aria-hidden="true"></div>
  <div class="auth-bubble auth-bubble-2" aria-hidden="true"></div>

  <div class="auth-card card shadow-lg max-w-auth">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-brand mb-1">Welcome back</h1>
        <p class="text-muted small mb-0">Please enter your details to sign in</p>
      </div>

      <form class="d-flex flex-column gap-3">
        <div>
          <label for="login-email" class="form-label fw-semibold">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control form-control-lg"
            placeholder="your@email.com"
            required
          />
        </div>

        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label fw-semibold mb-0">Password</label>
            <a [routerLink]="['/resetpassword']" class="small text-brand fw-semibold text-decoration-none">
              Forgot password?
            </a>
          </div>
          <input
            id="login-password"
            type="password"
            class="form-control form-control-lg"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-brand mt-1">
          Log In
        </button>
      </form>

      <div class="divider-or" role="separator">
        <span>or</span>
      </div>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
          <i class="fa-brands fa-google text-danger" aria-hidden="true"></i>
          <span>Continue with Google</span>
        </button>

        <button type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
          <i class="fa-brands fa-facebook text-primary" aria-hidden="true"></i>
          <span>Continue with Facebook</span>
        </button>
      </div>

      <p class="text-center text-muted small mt-4 mb-0">
        Don’t have an account?
        <a [routerLink]="['/signup']" class="text-brand fw-bold text-decoration-none ms-1">Create an account</a>
      </p>
    </div>
  </div>
</div>
