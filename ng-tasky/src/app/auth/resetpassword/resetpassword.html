<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="auth-card card shadow-lg max-w-auth w-100">
    <div class="card-body p-4 p-md-5">

      @if (!token) {
        <!-- Étape 1 : demande d'email -->
        <div class="text-center mb-4">
          <h4 class="fw-bold text-brand mb-1">Forgot password?</h4>
          <p class="text-muted small mb-0">Enter your email to receive a reset link</p>
        </div>

        <form [formGroup]="requestForm" (ngSubmit)="requestReset()">
          <div class="mb-3">
            <input type="email" class="form-control" formControlName="email" placeholder="e.g. babie@gmail.com">
          </div>

          @if (message()) {
            <div class="alert alert-success py-2 small">{{ message() }}</div>
          }
          @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="requestForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Sending...' : 'Send reset link' }}
          </button>
        </form>
      } @else {
        <!-- Étape 2 : nouveau mot de passe -->
        <div class="text-center mb-4">
          <h4 class="fw-bold text-brand mb-1">Reset your password</h4>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="confirmReset()">
          <div class="mb-3">
            <input type="password" class="form-control" formControlName="password" placeholder="New password">
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm new password">
          </div>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="resetForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Updating...' : 'Update password' }}
          </button>
        </form>
      }

    </div>
  </div>
</div>
