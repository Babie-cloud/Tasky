<div class="auth-wrapper">
  <div class="auth-bubble auth-bubble-1" aria-hidden="true"></div>
  <div class="auth-bubble auth-bubble-2" aria-hidden="true"></div>

  <div class="auth-card card shadow-lg max-w-auth">
    <div class="card-body p-4 p-md-5">
      <div class="icon-circle mx-auto mb-3" aria-hidden="true">
        <i class="fa-solid fa-key"></i>
      </div>

      <div class="text-center mb-4">
        <h1 class="h4 fw-bold text-brand mb-1">Reset Password</h1>
        <p class="text-muted small mb-0">
          Enter your email or username and we'll send you a link to reset your password.
        </p>
      </div>

      <form class="d-flex flex-column gap-3">
        <div>
          <label for="username" class="form-label fw-semibold">
            Username or Email <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            id="username"
            class="form-control form-control-lg"
            placeholder="Enter your username or email"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-brand mt-1">
          Send Reset Link
        </button>
      </form>

      <p class="text-center text-muted small mt-4 mb-0">
        Remembered your password?
        <a [routerLink]="['/login']" class="text-brand fw-bold text-decoration-none ms-1">Log in</a>
      </p>
    </div>
  </div>
</div>
